[tool.poetry]
name = "pyautoupdater"
version = "0.1.0"
description = ""
authors = ["yang, qingfeng <319511269@qq.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
requests = "^2.28.0"
packaging = "^22.0"
pydistmaker = {version = "^0.1.0", source = "pypi-iav-cn"}

[tool.poetry.extras]
security = ["cryptography", "python-gnupg"]
delta = ["bsdiff4"]


[[tool.poetry.source]]
name = "pypi-iav-cn"
url = "https://artifactory.iav.com/artifactory/api/pypi/pypi-iav-cn/simple/"
priority = "supplemental"  # 可选值: primary, secondary, supplemental

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
